name: Publish NuGet Packages

# GENERAL release rule (AgentBridge/Graphene convention): a plain push is a code sync and
# publishes nothing. Publishing is explicit and versioned: push a tag v* (e.g. v1.26.09.09)
# and this workflow packs and publishes BackupLibrary, then DataRedundancy, then
# AntiGitLibrary (it project-references the first two, so their packages must exist first),
# all at the tag version.
#
# NOTE: no -p:PackageId here on purpose. The pack target names the package after the project
# file (BackupLibrary, DataRedundancy, AntiGitLibrary); a global PackageId would leak into
# every ProjectReference in the restore graph and break with "Ambiguous project name".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack BackupLibrary
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          dotnet pack Backup/BackupLibrary.csproj -c Release -o ./out \
            -p:Version="$VER" -p:SkipNuGetPush=true
      - name: Push BackupLibrary
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set on this repository — the package was NOT published."
            exit 1
          fi
          dotnet nuget push ./out/BackupLibrary.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Pack DataRedundancy
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          dotnet pack DataRedundancy/DataRedundancy.csproj -c Release -o ./out \
            -p:Version="$VER" -p:SkipNuGetPush=true
      - name: Push DataRedundancy
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set on this repository — the package was NOT published."
            exit 1
          fi
          dotnet nuget push ./out/DataRedundancy.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Pack AntiGitLibrary
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER="${VER#v}"
          dotnet pack AntiGit/AntiGitLibrary.csproj -c Release -o ./out \
            -p:Version="$VER" -p:SkipNuGetPush=true
      - name: Push AntiGitLibrary
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set on this repository — the package was NOT published."
            exit 1
          fi
          dotnet nuget push ./out/AntiGitLibrary.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
